[project]
name = "briefbot"
version = "0.1.0"
description = "Multi-agent research assistant: planner, parallel researchers, writer, critic loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "langchain-ollama>=0.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
